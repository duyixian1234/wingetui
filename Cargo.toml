[workspace]
resolver = "2"
members = [".", "crates/winget"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/duyixian1234/wingetui"

[workspace.dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "macros", "time", "io-util"] }
encoding_rs = "0.8"
unicode-width = "0.2"

[package]
name = "wingetui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "管理 winget 的 TUI 工具（Rust + ratatui + crossterm + tokio）"

[dependencies]
crossterm = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true }
winget = { path = "crates/winget" }

[dev-dependencies]
tempfile = "3"
